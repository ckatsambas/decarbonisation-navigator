[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decarbonisation-navigator"
version = "0.1.0"
description = "Multi-criteria evaluation of ship decarbonisation investments under the IMO Net-Zero Framework, EU ETS and FuelEU Maritime"
authors = [{ name = "Christos Katsampas" }]
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "PySide6==6.9.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyqtgraph>=0.13.7",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.10", "ruff>=0.6"]

[project.gui-scripts]
decarbonisation-navigator = "navigator.__main__:main"

[tool.setuptools.packages.find]
include = ["navigator*"]

[tool.setuptools.package-data]
navigator = ["config/**/*.json", "i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py312"
