[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decarbonisation-navigator"
version = "0.1.7"
description = "Multi-criteria evaluation of ship decarbonisation investments under the IMO Net-Zero Framework, EU ETS and FuelEU Maritime"
authors = [{ name = "Christos Katsampas" }]
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "PySide6==6.9.3",
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "matplotlib>=3.9",
  "python-calamine>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.10", "ruff>=0.6"]

[project.gui-scripts]
decarbonisation-navigator = "navigator.__main__:main"

[tool.setuptools.packages.find]
include = ["navigator*"]

[tool.setuptools.package-data]
navigator = ["config/**/*.json", "i18n/*.json", "i18n/*.md", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set so new ruff releases do not change what CI checks
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "W"]
ignore = ["E731"]
