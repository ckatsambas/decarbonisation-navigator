name: Release builds

# Publish a release on GitHub (Releases → Draft a new release → new tag such as v0.1.0 on main)
# to build the Windows and macOS programs and attach them to it. Running the workflow by hand
# builds the programs as downloadable artifacts without a release.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: pyinstaller --noconfirm navigator.spec
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DecarbonisationNavigator.exe -DestinationPath DecarbonisationNavigator-Windows.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r -y ../DecarbonisationNavigator-macOS.zip "Decarbonisation Navigator.app"
      - uses: actions/upload-artifact@v4
        with:
          name: DecarbonisationNavigator-${{ runner.os }}
          path: DecarbonisationNavigator-*.zip
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: DecarbonisationNavigator-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
